services:
  - type: web
    name: nifty-quant-terminal
    runtime: python
    plan: free
    region: singapore # Lowest latency to NSE / Mumbai servers
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py app:app
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
      - key: PORT
        value: 10000
      - key: KOTAK_CONSUMER_KEY
        sync: false
      - key: KOTAK_ACCESS_TOKEN
        sync: false
      - key: KOTAK_USER_ID
        sync: false
      - key: KOTAK_PASSWORD
        sync: false
      - key: KOTAK_MPIN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
